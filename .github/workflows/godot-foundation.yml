name: BigArcade Godot Foundation
on:
  push:
    branches: [main, 'foundation/**']
    paths:
      - 'foundation/**'
      - '.github/workflows/godot-foundation.yml'
  pull_request:
    paths:
      - 'foundation/**'
      - '.github/workflows/godot-foundation.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r foundation/requirements-build.txt
      - run: sudo apt-get update && sudo apt-get install -y pkg-config
      - run: python foundation/tools/test_native.py
      - run: python foundation/tools/bootstrap.py
      - run: python foundation/tools/build.py --platform linuxbsd --profile release --jobs 2
      - run: python foundation/tools/verify.py --binary foundation/engine/godot/bin/bigarcade.linuxbsd.editor.x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigarcade-linux
          path: |
            foundation/reports/
            foundation/engine/godot/bin/bigarcade.linuxbsd.editor.x86_64
  windows:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python -m pip install -r foundation/requirements-build.txt
      - run: python foundation/tools/bootstrap.py
      - run: python foundation/tools/build.py --platform windows --profile release --jobs 2
      - run: python foundation/tools/verify.py --binary foundation/engine/godot/bin/bigarcade.windows.editor.x86_64.console.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigarcade-windows
          path: |
            foundation/reports/
            foundation/engine/godot/bin/*.exe
